# Rebuilds the site with fresh launch data and publishes it to GitHub Pages.
#
# It runs every hour, on every push to main, and from the "Run workflow" button.
# The fresh data is NOT committed back to the repository: the published site is
# simply rebuilt from it. data/launches.json in the repo is only a snapshot for
# local development and a fallback (see the fetch step).
name: Update data and deploy

on:
  schedule:
    # Minute 17 rather than 0: GitHub queues many jobs on the hour and delays them.
    # Scheduled runs only happen on the default branch (main).
    - cron: '17 * * * *'
  push:
    branches: [main]
  workflow_dispatch:

# What the built-in token may do: read the code, publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer run waits for the current one to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          # Node 26 runs the TypeScript fetch script directly (type stripping).
          node-version: '26'
          cache: npm

      # Tells us the sub-folder the site is served from, e.g. "/launch-tracker".
      - name: Look up the Pages address
        id: pages
        uses: actions/configure-pages@v5

      # Hourly runs: if Launch Library is down or rate-limited, the script exits
      # non-zero, this job fails, and the previously published site stays up.
      # Stale data beats a broken site.
      - name: Fetch launch data (hourly and manual runs)
        if: github.event_name != 'push'
        run: node scripts/fetch-launches.ts

      # Code pushes: try for fresh data, but a data hiccup must not block
      # shipping a code change, so fall back to the snapshot in the repo.
      - name: Fetch launch data (code pushes, best effort)
        if: github.event_name == 'push'
        run: node scripts/fetch-launches.ts || echo "::warning::Launch data fetch failed; building with the committed snapshot."

      - name: Install dependencies
        run: npm ci

      # Translations from earlier runs, so each run only sends new text to the
      # translator. The newest cache wins over the snapshot in the repo. If
      # GitHub has evicted it, the only cost is translating everything again.
      - name: Restore cached translations
        uses: actions/cache/restore@v4
        with:
          path: data/translations.zh.json
          key: translations-zh-${{ github.run_id }}
          restore-keys: translations-zh-

      # Never blocks the deploy: text without a translation is shown in
      # English on the Chinese pages, labelled 原文, and retried next run.
      - name: Translate new text into Chinese (best effort)
        run: node scripts/translate.ts
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Save translations for the next run
        uses: actions/cache/save@v4
        with:
          path: data/translations.zh.json
          key: translations-zh-${{ github.run_id }}

      - name: Build the static site
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Upload the site
        uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
