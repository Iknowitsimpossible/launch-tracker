# Checks every pull request before it can reach main (and the live site).
#
# The deploy workflow only runs after a merge, so without this a typo, a broken
# import or a failing test would first show up as a failed hourly deploy.
# Uses the committed data snapshot: no network calls and no API keys needed.
name: Check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same pull request cancels the older, now-pointless run.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '26'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run the tests
        run: npm test

      # Also type-checks the whole project, including the data scripts.
      - name: Build the static site
        run: npm run build
