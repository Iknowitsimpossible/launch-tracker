<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 64 64">
  <!-- The app icon: the same ink rocket as favicon.svg, on a full square
       (phones round the corners themselves) and drawn a little smaller so it
       stays inside the safe zone when a launcher crops the icon to a circle. -->
