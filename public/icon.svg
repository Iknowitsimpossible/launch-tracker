  <g transform="translate(32 32) scale(0.8) translate(-32 -32) rotate(45 32 32)">
    <path d="M32 6c7 8 9 18 9 27v13H23V33c0-9 2-19 9-27z" fill="#18181b"/>
    <path d="M26 36l-10 12h10zM38 36l10 12h-10z" fill="#18181b"/>
    <circle cx="32" cy="24" r="3.5" fill="#faf8f3"/>
    <path d="M27 49h10l-5 11z" fill="#b4311a"/>
  </g>
</svg>
